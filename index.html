<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="JobReady AI giúp bạn xây dựng CV chuẩn ATS, thiết kế đẹp và tối ưu cho từng vị trí ứng tuyển chỉ trong vài phút."
    />
    <title>JobReady AI</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <!-- crossorigin required on both preconnects for CORS font fetching to work with CSP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Google Fonts stylesheet — no SRI and no nonce needed here:
      • The styleSrc CSP directive allows https://fonts.googleapis.com as an explicit host.
      • SRI intentionally omitted: Google Fonts URL is dynamic (query-string based)
        and Google rotates CDN assets; pinning a hash would break font loading.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" crossorigin="anonymous">

    <!--
      Inline script to prevent theme flashing (FOUC).
      Allowed by CSP scriptSrc 'unsafe-inline' directive.
    -->
    <script>
      (function() {
        var t = localStorage.getItem("homepage-theme");
        if (t === "dark") document.documentElement.classList.add("dark");
        else if (t === "rose") document.documentElement.classList.add("rose");
        // else: light theme (no class needed)
      })();
    </script>
    <!--
      Google Sign-In (GSI): SRI integrity hash intentionally omitted.
      Google explicitly does not support pinning gsi/client to a specific hash
      because the file is auto-updated for security patches.
      Allowed via CSP scriptSrc allowlist.
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Facebook SDK -->
    <script>
      window.fbAsyncInit = function() {
        console.log('[FB SDK] fbAsyncInit được gọi, bắt đầu FB.init()...');
        console.log('[FB SDK] App ID:', '%VITE_FACEBOOK_APP_ID%');
        console.log('[FB SDK] Version:', 'v21.0');
        FB.init({
          appId      : '%VITE_FACEBOOK_APP_ID%',
          cookie     : true,
          xfbml      : true,
          version    : 'v21.0'
        });
        console.log('[FB SDK] FB.init() hoàn tất');
        console.log('[FB SDK] FB.getLoginStatus():', FB.getLoginStatus(function(r) {
          console.log('[FB SDK] Trạng thái đăng nhập hiện tại:', r);
        }));
      };

      (function(d, s, id){
         var js, fjs = d.getElementsByTagName(s)[0];
         if (d.getElementById(id)) {return;}
         js = d.createElement(s); js.id = id;
         js.src = "https://connect.facebook.net/en_US/sdk.js";
         fjs.parentNode.insertBefore(js, fjs);
         console.log('[FB SDK] Script element created and appended');
       }(document, 'script', 'facebook-jssdk'));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
